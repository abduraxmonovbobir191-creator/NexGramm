apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.core:core:1.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = APP_PACKAGE

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    // NexGramm: our own signing key when CI has it (secrets NEX_KEYSTORE_B64 / NEX_KEYSTORE_PASSWORD, decoded to
    // NEX_KEYSTORE_FILE by the workflow; alias "nexgramm"). Without it: Telegram's public sample key from the
    // repo, which Play Protect distrusts because anyone can sign with it.
    def nexKeystore = (System.getenv('NEX_KEYSTORE_FILE') ?: '').trim()
    def nexKeystorePassword = (System.getenv('NEX_KEYSTORE_PASSWORD') ?: '').trim()
    def useNexKey = !nexKeystore.isEmpty() && !nexKeystorePassword.isEmpty() && file(nexKeystore).exists()

    signingConfigs {
        debug {
            storeFile useNexKey ? file(nexKeystore) : file("../TMessagesProj/config/release.keystore")
            storePassword useNexKey ? nexKeystorePassword : RELEASE_STORE_PASSWORD
            keyAlias useNexKey ? 'nexgramm' : RELEASE_KEY_ALIAS
            keyPassword useNexKey ? nexKeystorePassword : RELEASE_KEY_PASSWORD
        }

        release {
            storeFile useNexKey ? file(nexKeystore) : file("../TMessagesProj/config/release.keystore")
            storePassword useNexKey ? nexKeystorePassword : RELEASE_STORE_PASSWORD
            keyAlias useNexKey ? 'nexgramm' : RELEASE_KEY_ALIAS
            keyPassword useNexKey ? nexKeystorePassword : RELEASE_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            // NexGramm: not debuggable, so Android compiles and runs it at full speed
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.debug
            minifyEnabled false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
        standalone {
            matchingFallbacks = ['release']
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }
    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        afat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 9
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        versionName APP_VERSION_NAME

        // NexGramm: AdMob app id (-PADMOB_APP_ID or env). The SDK needs one at start, so without it Google's
        // sample id is used; no ads load then unless ADMOB_BANNER_ID is set too.
        def admobAppId = (project.findProperty('ADMOB_APP_ID') ?: System.getenv('ADMOB_APP_ID') ?: '').toString().trim()
        if (admobAppId.isEmpty()) {
            admobAppId = 'ca-app-pub-3940256099942544~3347511713'
        }
        if (!(admobAppId ==~ /ca-app-pub-[0-9]+~[0-9]+/)) {
            throw new GradleException("ADMOB_APP_ID must be ca-app-pub-<n>~<n>, got: " + admobAppId)
        }
        manifestPlaceholders["admobAppId"] = admobAppId
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'uz.nexgramm.app'

    lintOptions {
        checkReleaseBuilds false
    }
}

// NexGramm: google-services.json is Telegram's and has no client for uz.nexgramm.app; disabled until our own Firebase config is added
// apply plugin: 'com.google.gms.google-services'
