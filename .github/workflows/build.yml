name: Build debug APK

on:
  workflow_dispatch:
    inputs:
      bot_username:
        description: "NexGramm bot username, @ siz (bo'sh bo'lsa: vars.NEXGRAMM_BOT_USERNAME)"
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MODULE_GRADLE: TMessagesProj_AppStandalone/build.gradle
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /usr/lib/jvm/java-8* /usr/lib/jvm/java-11*
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read SDK/NDK versions from Gradle files
        run: |
          compile_sdk=$(grep -oP 'compileSdkVersion\s+\K[0-9]+' "$MODULE_GRADLE" | head -1)
          build_tools=$(grep -oP "buildToolsVersion\s+'\K[^']+" "$MODULE_GRADLE" | head -1)
          ndk=$(grep -oP 'ndkVersion\s+"\K[^"]+' "$MODULE_GRADLE" | head -1)
          cmake=$(grep -oP "version\s+'\K[0-9.]+" "$MODULE_GRADLE" | head -1)
          echo "compileSdk=$compile_sdk buildTools=$build_tools ndk=$ndk cmake=$cmake"
          for v in "$compile_sdk" "$build_tools" "$ndk" "$cmake"; do [ -n "$v" ] || { echo "Version parse failed"; exit 1; }; done
          {
            echo "COMPILE_SDK=$compile_sdk"
            echo "BUILD_TOOLS=$build_tools"
            echo "NDK_VERSION=$ndk"
            echo "CMAKE_VERSION=$cmake"
          } >> "$GITHUB_ENV"

      # AGP 8.13 requires JDK 17 (same as the project's Dockerfile: gradle:8.13-jdk17)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK; use its sdkmanager directly
      - name: Install Android SDK packages
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Inject Telegram API credentials (CI only, not committed)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::secrets.TG_API_ID / secrets.TG_API_HASH are not set"; exit 1
          fi
          f=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i -E "s/(public static int APP_ID = )[0-9]+;/\1${TG_API_ID};/" "$f"
          sed -i -E "s/(public static String APP_HASH = \")[^\"]*(\";)/\1${TG_API_HASH}\2/" "$f"
          grep -q "APP_ID = ${TG_API_ID};" "$f" || { echo "::error::APP_ID replace failed"; exit 1; }
          grep -q "APP_HASH = \"${TG_API_HASH}\";" "$f" || { echo "::error::APP_HASH replace failed"; exit 1; }

      # android.injected.build.abi limits the native (CMake) build to one ABI without editing Gradle files.
      # AGP treats any injected build-target property as an IDE deploy and adds
      # android:testOnly="true" (INSTALL_FAILED_TEST_ONLY); android.injected.testOnly=false overrides that.
      # Core settings are not secrets: CORE_API_URL (default https://ng.nexecos.com) and the bot username
      - name: Build debug APK (arm64-v8a)
        env:
          CORE_API_URL: ${{ vars.CORE_API_URL }}
          NEXGRAMM_BOT_USERNAME: ${{ inputs.bot_username || vars.NEXGRAMM_BOT_USERNAME }}
        run: |
          chmod +x gradlew
          echo "CORE_API_URL=${CORE_API_URL:-https://ng.nexecos.com (default)} NEXGRAMM_BOT_USERNAME=${NEXGRAMM_BOT_USERNAME:-<empty>}"
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug \
            -PCORE_API_URL="$CORE_API_URL" -PNEXGRAMM_BOT_USERNAME="$NEXGRAMM_BOT_USERNAME" \
            -Pandroid.injected.build.abi=arm64-v8a -Pandroid.injected.testOnly=false --stacktrace

      # Lists every APK so the real output path is visible in the log
      - name: List APKs
        run: find . -name '*.apk' -not -path './.git/*'

      # Path confirmed by the find step above (run 38079639630); with
      # android.injected.build.abi AGP writes the APK to intermediates/, not outputs/
      # archive: false uploads the bare .apk (the phone could not unpack the zip);
      # the artifact is named after the file, so copy it to a clear name first
      - name: Name the APK
        run: cp TMessagesProj_AppStandalone/build/intermediates/apk/afat/debug/app.apk nexgramm-debug-arm64-v8a.apk

      - uses: actions/upload-artifact@v7.0.2
        with:
          path: nexgramm-debug-arm64-v8a.apk
          archive: false
          if-no-files-found: error

      # Diagnostics only: each check's output (and exit code) goes to the log and
      # report.txt; a failing check does not fail the job
      - name: Inspect APK (badging, signature, 16 KB alignment)
        run: |
          set +e
          apk=TMessagesProj_AppStandalone/build/intermediates/apk/afat/debug/app.apk
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          {
            echo "APK: $apk ($(stat -c %s "$apk") bytes)"
            echo "build-tools: $bt"
            echo
            echo "===== aapt2 dump badging ====="
            "$bt/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|minSdkVersion|targetSdkVersion|native-code|alt-native-code|application-label|application-debuggable|testOnly)"
            echo "exit=${PIPESTATUS[0]}"
            if "$bt/aapt2" dump badging "$apk" | grep -q "testOnly"; then
              echo "testOnly check: FOUND in aapt2 badging (APK will fail with INSTALL_FAILED_TEST_ONLY)"
            else
              echo "testOnly check: OK, the word testOnly is NOT in aapt2 badging"
            fi
            echo
            echo "===== apksigner verify -v --print-certs ====="
            "$bt/apksigner" verify -v --print-certs "$apk" 2>&1
            echo "exit=$?"
            echo
            echo "===== zipalign -c -P 16 -v 4 (lib/ entries, non-OK lines, summary) ====="
            "$bt/zipalign" -c -P 16 -v 4 "$apk" > zipalign.log 2>&1
            za=$?
            grep -E " lib/|^Verif" zipalign.log; grep -v "(OK" zipalign.log | grep -vE " lib/|^Verif"
            echo "lib/ entries: $(grep -c ' lib/' zipalign.log), BAD: $(grep -c 'BAD' zipalign.log)"
            echo "exit=$za"
          } 2>&1 | tee report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-inspection-report
          path: report.txt
          if-no-files-found: warn
